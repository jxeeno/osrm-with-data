name: Create and publish a Docker image

on:
  schedule:
    - cron: '36 10 * * *' # everyday at 10:36am
  push:
    branches: ['main']
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - osrm-version: v5.22.0
            osrm-profile: car
          # - osrm-version: latest
          #   osrm-profile: car
          # - osrm-version: v5.22.0
          #   osrm-profile: rail
          # - osrm-version: latest
          #   osrm-profile: rail
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v3
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/jxeeno/osrm-with-data
          # generate Docker tags based on the following events/attributes
          flavor: |
            prefix=${{matrix.osrm-profile}}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern=${{matrix.osrm-version}}
            type=sha
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      -
        name: Login to Github repository
        uses: docker/login-action@v1 
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push
        id: docker_build
        uses: docker/build-push-action@v2
        env:
          OSRM_VERSION: ${{matrix.osrm-version}}
          OSRM_PROFILE: ${{matrix.osrm-profile}}
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Current OSRM (v26+) car + rail images, used by anytrip-legacy-geo. Separate
  # from the job above so its tags (carmain, carnightly, sha-*) stay untouched.
  # Every tag here carries an explicit <profile>-<osrm version>- prefix, including
  # sha tags, so the two jobs can never overwrite each other:
  #   rail-v26.9.0-20260914   build date (Sydney) — pin these in deployments
  #   rail-v26.9.0-main       latest build from main
  #   rail-v26.9.0-nightly    latest scheduled build
  #   rail-v26.9.0-sha-abc1234
  build-v26:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        osrm-version: [v26.9.0]
        osrm-profile: [car, rail]

    steps:
      # The car build (source extract + graph in the build stage + final image
      # export) needs more than a stock runner's free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/jxeeno/osrm-with-data
          flavor: |
            latest=false
          tags: |
            type=raw,value={{date 'YYYYMMDD' tz='Australia/Sydney'}},prefix=${{ matrix.osrm-profile }}-${{ matrix.osrm-version }}-
            type=ref,event=branch,prefix=${{ matrix.osrm-profile }}-${{ matrix.osrm-version }}-
            type=schedule,pattern=nightly,prefix=${{ matrix.osrm-profile }}-${{ matrix.osrm-version }}-
            type=sha,prefix=${{ matrix.osrm-profile }}-${{ matrix.osrm-version }}-sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Github repository
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.v26
          platforms: linux/amd64
          build-args: |
            OSRM_IMAGE=ghcr.io/project-osrm/osrm-backend:${{ matrix.osrm-version }}-debian
            OSRM_PROFILE=${{ matrix.osrm-profile }}
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
